<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments :: head (titulo='Mis Equipos')"></head>

    <body>
        <nav th:replace="fragments :: menu"></nav>

        <div class="container mt-5">
            <div class="row mb-3">
                <div class="col-12">
                    <h2>Mis Equipos</h2>
                    <p class="text-muted">Aquí puedes ver todos los equipos a los que perteneces.</p>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-12">
                    <a th:href="@{/equipos/nuevo}" class="btn btn-primary">Crear Nuevo Equipo</a>
                </div>
            </div>

            <div th:if="${equipos.empty}" class="alert alert-info">
                <p>Aún no perteneces a ningún equipo. <a th:href="@{/equipos}">Explora los equipos disponibles</a> o <a th:href="@{/equipos/nuevo}">crea uno nuevo</a>.</p>
            </div>

            <table class="table table-striped table-hover" th:if="${!equipos.empty}">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre del Equipo</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="equipo : ${equipos}">
                        <td th:text="${equipo.id}">1</td>
                        <td>
                            <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}" class="font-weight-bold">Nombre</a>
                        </td>
                        <td>
                            <a th:href="@{/equipos/{id}(id=${equipo.id})}" class="btn btn-sm btn-info">Ver Detalles</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="row mt-3">
                <div class="col-12">
                    <a th:href="@{/equipos}" class="btn btn-secondary">Ver Todos los Equipos</a>
                </div>
            </div>
        </div>
    </body>
</html>
