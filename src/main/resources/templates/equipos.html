<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments :: head (titulo='Equipos')"></head>

    <body>
        <nav th:replace="fragments :: menu"></nav>

        <div class="container mt-5">
        <div class="row mb-3">
            <div class="col-12">
                <h2>Equipos de la Empresa</h2>
                <p class="text-muted">Consulta la estructura y los proyectos en curso.</p>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a th:href="@{/equipos/nuevo}" class="btn btn-primary">Crear Nuevo Equipo</a>
                <a th:href="@{/misequipos}" class="btn btn-info">Ver Mis Equipos</a>
            </div>
        </div>
        
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre del Equipo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="equipo : ${equipos}">
                    <td th:text="${equipo.id}">1</td>
                    <td>
                        <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}" class="font-weight-bold">Nombre</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
