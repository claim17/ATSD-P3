<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Equipo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Aquí deberías incluir tu navbar, por ejemplo: -->
    <!-- <div th:replace="fragments/navbar :: navbar"></div> -->

    <div class="container mt-5">
        <div class="row mb-3">
            <div class="col-12">
                <h2>Miembros del Equipo: <span th:text="${equipo.nombre}" class="text-primary">Nombre del Equipo</span></h2>
            </div>
        </div>

        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Email</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td th:text="${usuario.nombre}">John Doe</td>
                    <td th:text="${usuario.email}">johndoe@email.com</td>
                </tr>
                <tr th:if="${usuarios.empty}">
                    <td colspan="3" class="text-center text-muted">Aún no hay miembros asignados a este equipo.</td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/equipos}" class="btn btn-secondary mt-3">Volver al listado de equipos</a>
    </div>
</body>
</html>
